name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  build:
    environment: artifact-signing
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            args: --target universal-apple-darwin
            targets: aarch64-apple-darwin,x86_64-apple-darwin
          - os: windows-latest
            args: ""
            targets: ""
          - os: ubuntu-22.04
            args: ""
            targets: ""
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - if: matrix.os == 'ubuntu-22.04'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf xvfb
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067
        with:
          toolchain: 1.94.1
          targets: ${{ matrix.targets }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
      - run: npm ci
      - name: Build the launch check
        run: npm run tauri -- build --no-bundle --features background-test
      - name: Launch check
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          log="$RUNNER_TEMP/launch.log"
          app=src-tauri/target/release/ios-screen-time
          if [[ "$RUNNER_OS" == Linux ]]; then NO_AT_BRIDGE=1 xvfb-run -a "$app" > "$log" 2>&1 & else "$app" > "$log" 2>&1 & fi
          pid=$!
          for _ in $(seq 120); do
            grep -q "^app_ready" "$log" && break
            kill -0 "$pid" 2> /dev/null || break
            sleep 1
          done
          pkill -x ios-screen-time || true
          kill "$pid" 2> /dev/null || true
          grep -q "^app_ready" "$log" || { cat "$log"; echo "::error::the app did not finish loading"; exit 1; }
          echo "the app loaded"
      - name: Launch check
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $log = Join-Path $env:RUNNER_TEMP 'launch.log'
          $out = Join-Path $env:RUNNER_TEMP 'launch.out'
          $p = Start-Process -FilePath 'src-tauri\target\release\ios-screen-time.exe' -RedirectStandardError $log -RedirectStandardOutput $out -PassThru
          $ok = $false
          for ($i = 0; $i -lt 120; $i++) {
            Start-Sleep -Seconds 1
            if ((Test-Path $log) -and (Select-String -Quiet -Path $log -Pattern '^app_ready$' -ErrorAction SilentlyContinue)) { $ok = $true; break }
            if ($p.HasExited) { break }
          }
          if (-not $p.HasExited) { Stop-Process -Id $p.Id -Force }
          if (-not $ok) { Get-Content $log -ErrorAction SilentlyContinue; Write-Output '::error::the app did not finish loading'; exit 1 }
          Write-Output 'the app loaded'
      - name: Release notes
        id: notes
        shell: bash
        run: |
          set -euo pipefail
          { echo 'body<<__NOTES_EOF__'; cat RELEASE_NOTES.txt; echo '__NOTES_EOF__'; } >> "$GITHUB_OUTPUT"
      - name: macOS signing
        if: runner.os == 'macOS'
        shell: bash
        env:
          REQUIRE_SIGNING: ${{ github.ref_type == 'tag' }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_PRIVATE_KEY: ${{ secrets.APPLE_API_PRIVATE_KEY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          put() { printf '%s<<__SIGNING_EOF__\n%s\n__SIGNING_EOF__\n' "$1" "$2" >> "$GITHUB_ENV"; }
          if [[ -z "$APPLE_CERTIFICATE" ]]; then
            [[ "$REQUIRE_SIGNING" != true ]] || { echo "::error::APPLE_CERTIFICATE is required to release"; exit 1; }
            echo "::warning::APPLE_CERTIFICATE is not set; the macOS build is unsigned"
            exit 0
          fi
          put APPLE_CERTIFICATE "$APPLE_CERTIFICATE"
          put APPLE_CERTIFICATE_PASSWORD "$APPLE_CERTIFICATE_PASSWORD"
          [[ -z "$APPLE_SIGNING_IDENTITY" ]] || put APPLE_SIGNING_IDENTITY "$APPLE_SIGNING_IDENTITY"
          if [[ -n "$APPLE_API_KEY" && -n "$APPLE_API_ISSUER" && -n "$APPLE_API_PRIVATE_KEY" ]]; then
            key="$RUNNER_TEMP/AuthKey_$APPLE_API_KEY.p8"
            printf '%s\n' "$APPLE_API_PRIVATE_KEY" > "$key"
            chmod 600 "$key"
            put APPLE_API_KEY "$APPLE_API_KEY"
            put APPLE_API_ISSUER "$APPLE_API_ISSUER"
            put APPLE_API_KEY_PATH "$key"
          elif [[ -n "$APPLE_ID" && -n "$APPLE_PASSWORD" && -n "$APPLE_TEAM_ID" ]]; then
            put APPLE_ID "$APPLE_ID"
            put APPLE_PASSWORD "$APPLE_PASSWORD"
            put APPLE_TEAM_ID "$APPLE_TEAM_ID"
          else
            [[ "$REQUIRE_SIGNING" != true ]] || { echo "::error::notarization credentials are required to release"; exit 1; }
            echo "::warning::no notarization credentials; the macOS build is signed but not notarized"
          fi
      - name: Sign in to Azure for Artifact Signing
        if: runner.os == 'Windows' && vars.AZURE_ARTIFACT_SIGNING_CLIENT_ID != ''
        uses: azure/login@532459ea530d8321f2fb9bb10d1e0bcf23869a43
        with:
          client-id: ${{ vars.AZURE_ARTIFACT_SIGNING_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Windows signing
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          REQUIRE_SIGNING: ${{ github.ref_type == 'tag' }}
          AZURE_ARTIFACT_SIGNING_CLIENT_ID: ${{ vars.AZURE_ARTIFACT_SIGNING_CLIENT_ID }}
          CLIENT_VERSION: 1.0.128
          CLIENT_SHA256: 74bd7d27e6ce1051409c38d9b46bc8df0400ecd643d51ffbf2ac00869061e40b
        run: |
          $ErrorActionPreference = 'Stop'
          if (-not $env:AZURE_ARTIFACT_SIGNING_CLIENT_ID) {
            if ($env:REQUIRE_SIGNING -eq 'true') { Write-Output '::error::Azure Artifact Signing is required to release'; exit 1 }
            Write-Output '::warning::Azure Artifact Signing is not configured; the Windows build is unsigned'
            exit 0
          }
          $dir = Join-Path $env:RUNNER_TEMP 'artifact-signing'
          New-Item -ItemType Directory -Force -Path $dir | Out-Null
          $pkg = Join-Path $dir 'client.zip'
          Invoke-WebRequest -Uri "https://www.nuget.org/api/v2/package/Microsoft.ArtifactSigning.Client/$env:CLIENT_VERSION" -OutFile $pkg
          if ((Get-FileHash -Algorithm SHA256 $pkg).Hash -ne $env:CLIENT_SHA256) { throw 'Artifact Signing client hash mismatch' }
          Expand-Archive -Path $pkg -DestinationPath (Join-Path $dir 'client')
          $dlib = Join-Path $dir 'client\bin\x64\Azure.CodeSigning.Dlib.dll'
          if (-not (Test-Path $dlib)) { throw "missing $dlib" }
          $metadata = Join-Path $dir 'metadata.json'
          @{
            Endpoint = 'https://eus.codesigning.azure.net/'
            CodeSigningAccountName = 'actoglancewin'
            CertificateProfileName = 'actoglancepublic'
            ExcludeCredentials = @('ManagedIdentityCredential', 'WorkloadIdentityCredential', 'SharedTokenCacheCredential', 'VisualStudioCredential', 'VisualStudioCodeCredential', 'AzurePowerShellCredential', 'AzureDeveloperCliCredential', 'InteractiveBrowserCredential')
          } | ConvertTo-Json | Set-Content -Encoding utf8NoBOM $metadata
          $signtool = Get-ChildItem 'C:\Program Files (x86)\Windows Kits\10\bin\*\x64\signtool.exe' |
            Sort-Object { [version]$_.Directory.Parent.Name } | Select-Object -Last 1
          if (-not $signtool) { throw 'signtool.exe not found' }
          $signArgs = @('sign', '/v', '/fd', 'SHA256', '/tr', 'http://timestamp.acs.microsoft.com', '/td', 'SHA256', '/dlib', $dlib, '/dmdf', $metadata, '/d', 'iOS Screen Time', '%1')
          $conf = @{ bundle = @{ windows = @{ signCommand = @{ cmd = $signtool.FullName; args = $signArgs } } } }
          $conf | ConvertTo-Json -Depth 6 | Set-Content -Encoding utf8NoBOM src-tauri/tauri.windows.conf.json
          'WINDOWS_SIGNED=true' | Out-File -Append -Encoding utf8 $env:GITHUB_ENV
      - uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
          releaseName: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
          releaseBody: ${{ steps.notes.outputs.body }}
          uploadWorkflowArtifacts: ${{ github.ref_type != 'tag' }}
          args: ${{ matrix.args }}
      - name: Attach the source code
        if: runner.os == 'Linux' && github.ref_type == 'tag'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          name="ios-screen-time-source-${GITHUB_REF_NAME#v}.tar.gz"
          cp source/ios-screen-time-source.tar.gz "$RUNNER_TEMP/$name"
          gh release upload "$GITHUB_REF_NAME" "$RUNNER_TEMP/$name" --clobber
      - name: Notarize the disk image
        id: dmg
        if: runner.os == 'macOS' && env.APPLE_CERTIFICATE != ''
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IS_TAG: ${{ github.ref_type == 'tag' }}
        run: |
          set -euo pipefail
          dmg="$(ls src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg)"
          if [[ -n "${APPLE_API_KEY_PATH:-}" ]]; then
            xcrun notarytool submit "$dmg" --key "$APPLE_API_KEY_PATH" --key-id "$APPLE_API_KEY" --issuer "$APPLE_API_ISSUER" --wait
          elif [[ -n "${APPLE_ID:-}" ]]; then
            xcrun notarytool submit "$dmg" --apple-id "$APPLE_ID" --password "$APPLE_PASSWORD" --team-id "$APPLE_TEAM_ID" --wait
          else
            [[ "$IS_TAG" != true ]] || { echo "::error::notarization credentials are required to release"; exit 1; }
            echo "::warning::the disk image is signed but not notarized"
            exit 0
          fi
          xcrun stapler staple "$dmg"
          xcrun stapler validate "$dmg"
          spctl -a -t open --context context:primary-signature -vv "$dmg"
          echo "path=$dmg" >> "$GITHUB_OUTPUT"
          if [[ "$IS_TAG" == true ]]; then
            asset="$(gh release view "$GITHUB_REF_NAME" --json assets --jq '.assets[].name | select(endswith(".dmg"))')"
            [[ -n "$asset" && "$asset" != *$'\n'* ]] || { echo "::error::expected one .dmg asset, found: $asset"; exit 1; }
            cp "$dmg" "$RUNNER_TEMP/$asset"
            gh release upload "$GITHUB_REF_NAME" "$RUNNER_TEMP/$asset" --clobber
          fi
      - name: Replace the disk image artifact
        if: steps.dmg.outputs.path != '' && github.ref_type != 'tag'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: darwin-universal-dmg
          path: ${{ steps.dmg.outputs.path }}
          overwrite: true
      - name: Verify Windows signatures
        if: runner.os == 'Windows' && env.WINDOWS_SIGNED == 'true'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          function Assert-Signed($path) {
            $sig = Get-AuthenticodeSignature -FilePath $path
            if ($sig.Status -ne 'Valid') { throw "$path`: $($sig.Status) $($sig.StatusMessage)" }
            Write-Output "$(Split-Path -Leaf $path): $($sig.SignerCertificate.Subject)"
          }
          $bundle = 'src-tauri/target/release/bundle'
          $nsis = @(Get-ChildItem "$bundle/nsis" -Filter '*.exe')
          $msi = @(Get-ChildItem "$bundle/msi" -Filter '*.msi')
          if ($nsis.Count -ne 1 -or $msi.Count -ne 1) { throw "expected one NSIS and one MSI installer, found $($nsis.Count) and $($msi.Count)" }
          Assert-Signed $nsis[0].FullName
          Assert-Signed $msi[0].FullName
          $out = Join-Path $env:RUNNER_TEMP 'unpacked'
          7z x $nsis[0].FullName "-o$out/nsis" -y | Out-Null
          if ($LASTEXITCODE -ne 0) { throw "7z could not unpack $($nsis[0].Name)" }
          Start-Process msiexec.exe -Wait -NoNewWindow -ArgumentList @('/a', "`"$($msi[0].FullName)`"", '/qn', "TARGETDIR=`"$out\msi`"")
          foreach ($kind in 'nsis', 'msi') {
            $apps = @(Get-ChildItem "$out/$kind" -Recurse -File -Filter 'ios-screen-time.exe')
            if ($apps.Count -lt 1) { throw "no ios-screen-time.exe inside the $kind installer" }
            foreach ($app in $apps) { Write-Output "$kind payload:"; Assert-Signed $app.FullName }
          }
      - name: Attest build provenance
        if: github.event.repository.visibility == 'public'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8
        with:
          subject-path: |
            src-tauri/target/**/release/bundle/dmg/*.dmg
            src-tauri/target/**/release/bundle/macos/*.app.tar.gz
            src-tauri/target/**/release/bundle/nsis/*.exe
            src-tauri/target/**/release/bundle/msi/*.msi
            src-tauri/target/**/release/bundle/deb/*.deb
            src-tauri/target/**/release/bundle/appimage/*.AppImage
