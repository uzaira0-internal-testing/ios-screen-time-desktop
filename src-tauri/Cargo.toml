[package]
name = "ios-screen-time"
version = "0.6.2"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "iOS Screen Time Screenshot Processing desktop app"

[workspace]

[lib]
name = "ios_screen_time"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6", features = [] }

[dependencies]
tauri = { version = "2.12", features = [] }
tauri-plugin-updater = "2.13"
tauri-plugin-process = "2.4"
tauri-plugin-window-state = "2.5"
tauri-plugin-single-instance = "2.5"
tauri-plugin-dialog = "2.8"
tauri-plugin-fs = "2.6"
tauri-plugin-notification = "2.5"
serde_json = "1"

[target.'cfg(windows)'.dependencies]
tauri-plugin-prevent-default = { version = "6", features = ["platform-windows"] }

[target.'cfg(not(windows))'.dependencies]
tauri-plugin-prevent-default = "6"

[features]
devtools = ["tauri/devtools"]
background-test = []
